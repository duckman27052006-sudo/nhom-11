name: CI

on:
  # Chạy khi merge vào main và cho mọi PR; không chạy lặp trên nhánh feature
  # (push + pull_request sẽ tạo 2 run trùng cho cùng một commit).
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Sản phẩm là Windows-first (EXCLUSIVEADDRUSE, reparse point, PySide6),
          # nên phải có ít nhất hai mốc Windows thay vì chỉ Linux.
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[web]"
      - name: Run tests
        run: python -m unittest discover -v
      - name: Entry points smoke test
        # Lỗi "ModuleNotFoundError: src..." từng tồn tại mà không job nào bắt,
        # vì CI chỉ chạy `python -m`. Gọi thẳng console script đã cài.
        run: |
          python -c "import subprocess, sys; [subprocess.run([name, '--version'], check=True) for name in ('tftp-server', 'tftp-client')]"
          python -c "import subprocess; subprocess.run(['tftp-web-upload', '--help'], check=True, stdout=subprocess.DEVNULL)"

  lint:
    name: lint + type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # Ghim ruff (đã kiểm) và dải mypy để một bản mới không làm đỏ CI oan.
        run: |
          python -m pip install "ruff==0.17.0" "mypy>=1.11,<2"
          python -m pip install -e .
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy (toàn package, gồm GUI)
        run: python -m mypy tftp

  gui:
    name: GUI (offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install with GUI extras
        run: python -m pip install -e ".[gui]"
      - name: GUI tests
        run: python -m unittest tests.test_gui_smoke -v

  coverage:
    name: coverage (no soak)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TFTP_SKIP_SOAK: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0
      - name: Install
        run: python -m pip install -e ".[web,dev,gui]"
      - name: Run with coverage
        run: |
          python -m coverage run --source=tftp -m unittest discover -s tests -t .
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Soak/stress test nặng: chạy riêng để CI chính vẫn nhanh.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Soak test (file lớn, nhiều client, mất gói)
        env:
          TFTP_SOAK_MB: "64"
          TFTP_SOAK_CLIENTS: "48"
          TFTP_SOAK_CYCLES: "20"
          TFTP_SOAK_BLOCKS: "140000"
        run: python -m unittest tests.test_soak -v

  # Tương thích với implementation độc lập: tftpd-hpa + atftp.
  # Đây là bằng chứng duy nhất cho các đường OACK/netascii/TID mà self-test
  # không thể chứng minh.
  interop:
    name: interop (tftpd-hpa + atftp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tftp implementations
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tftpd-hpa atftp
      - name: Install project
        run: python -m pip install -e .
      - name: Interop matrix
        env:
          PYTHON: python
        run: bash scripts/interop.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # advisory DB thay đổi ngoài tầm kiểm soát của PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: pip-audit
        run: |
          python -m pip install -e ".[web,dev]"
          python -m pip_audit --skip-editable
