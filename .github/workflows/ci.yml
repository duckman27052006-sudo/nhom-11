name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -v
      - name: Compile check
        run: >-
          python -m py_compile src/tftp_packet.py src/tftp_errors.py
          src/tftp_metrics.py src/tftp_server.py src/tftp_client.py
      - name: Lint
        run: |
          python -m pip install --upgrade ruff
          ruff check .

  # Soak/stress test nặng: chạy riêng để CI chính vẫn nhanh.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soak test (file lớn, nhiều client, mất gói)
        env:
          TFTP_SOAK_MB: "64"
          TFTP_SOAK_CLIENTS: "48"
          TFTP_SOAK_CYCLES: "20"
          TFTP_SOAK_BLOCKS: "140000"
        run: python -m unittest tests.test_soak -v
