name: CI

on:
  # Chạy khi merge vào main và cho mọi PR; không chạy lặp trên nhánh feature
  # (push + pull_request sẽ tạo 2 run trùng cho cùng một commit).
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          python -m pip install -e ".[web]"
          python -m unittest discover -v
      - name: Compile check
        run: >-
          python -m py_compile tftp/tftp_packet.py tftp/tftp_errors.py
          tftp/tftp_metrics.py tftp/tftp_server.py tftp/tftp_client.py
          tftp/web_store.py tftp/web_upload/__init__.py
      - name: Lint
        run: |
          python -m pip install --upgrade ruff
          ruff check .
      - name: Type check (core)
        run: |
          python -m pip install mypy
          python -m mypy tftp/tftp_packet.py tftp/tftp_errors.py tftp/tftp_metrics.py tftp/tftp_net.py tftp/tftp_server.py tftp/tftp_client.py tftp/web_upload/__init__.py --ignore-missing-imports

  # Soak/stress test nặng: chạy riêng để CI chính vẫn nhanh.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soak test (file lớn, nhiều client, mất gói)
        env:
          TFTP_SOAK_MB: "64"
          TFTP_SOAK_CLIENTS: "48"
          TFTP_SOAK_CYCLES: "20"
          TFTP_SOAK_BLOCKS: "140000"
        run: python -m unittest tests.test_soak -v
