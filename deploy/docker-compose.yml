name: tftp-chat

# Cả hai service dùng host network để web gateway nhìn thấy IP thật của client
# (ACL --allowed-network) và TFTP chỉ nghe trên loopback của host.
# Docker Desktop trên Windows không hỗ trợ host network: dùng WSL2/Linux hoặc
# chạy native (xem deploy/README.md).
x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: tftp-chat:local
  restart: unless-stopped
  init: true
  network_mode: host
  env_file:
    - .env
  volumes:
    - ${HOST_FILES_DIR:-./data/files}:/srv/tftp/files
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  tftp:
    <<: *common
    command:
      - python
      - -m
      - tftp.tftp_server
      - --host
      - 127.0.0.1
      - --port
      - "6969"
      - --root
      - /srv/tftp/files
      - --windowsize
      - "8"
      - --tid-port-range
      - 50000-50100
    mem_limit: 256m
    cpus: 1.0

  web:
    <<: *common
    depends_on:
      tftp:
        condition: service_started
    command: ["python", "deploy/run_web.py"]
    volumes:
      - ${HOST_FILES_DIR:-./data/files}:/srv/tftp/files
      - ${HOST_DATA_DIR:-./data/web-data}:/srv/tftp/web-data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      # Liveness rẻ (chỉ SQLite); readiness/TFTP đã có /readyz riêng cho monitoring.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
